[package]
name = "arabella"
version = "0.1.0"
authors = ["kevinn.s <vinn1864.s@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["console_error_panic_hook"]

[dependencies]
wasm-bindgen = "0.2.84"
console_error_panic_hook = { version = "0.1.7", optional = true }
web-sys = { 
    version = "0.3.94", 
    features = [
        "Document",
        "Element",
        "HtmlCanvasElement",
        "Window",
        "WebGl2RenderingContext",
        "WebGlBuffer",
        "WebGlFramebuffer",
        "WebGlProgram",
        "WebGlShader", # Added back as you'll need this to compile shaders for your Program
        "WebGlTexture",
        "WebGlUniformLocation",
        "WebGlVertexArrayObject",
        ]
    }
fearless_simd = "0.4.0"
bytemuck = { version= "1.25.0",features = ["derive"] }
kurbo = "0.13.0"
peniko = "0.6.0"
rayon = "1.11.0"
[dev-dependencies]
wasm-bindgen-test = "0.3.34"

[profile.release]
# Tell `rustc` to optimize for small code size.
opt-level = "s"
