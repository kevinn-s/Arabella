[package]
name = "arabella"
version = "0.1.0"
description = "A Parallel, hybrid CPU/GPU renderer, balancing computation between CPU and GPU for efficiency."
categories = ["rendering", "graphics"]
keywords = ["2d", "vector-graphics"]
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/kevinn-s/arabella"

# Workspace members: the root `arabella` library plus per-example crates
# under `examples/`. Mirrors the layout used by vello_hybrid so we can run
# the demo with `cargo run_wasm -p native_webgl --release` (a real
# release-tuned cdylib in the browser instead of the wasm-bindgen-test
# harness, which adds 3–5× instrumentation overhead).
[workspace]
members = [
    ".",
    "examples/run_wasm",
    "examples/native_webgl",
]

[package.metadata.docs.rs]
all-features = true
default-target = "x86_64-unknown-linux-gnu"
targets = ["wasm32-unknown-unknown"]

[dependencies]
bytemuck = { version = "1.25.0", features = ["derive", "extern_crate_alloc"]}
fearless_simd = { version = "0.4.0"  }
png = { version = "0.18.1", optional = true } 
hashbrown = { version = "0.17.0" }
smallvec =  "1.15.1"
thiserror = { version = "2.0.18" }
log = "0.4.29"
lyon_path = "1.0.19"
lyon_geom = "1.0.19"
lyon_algorithms = "1.0.20"
peniko = { version = "0.6.1", default-features = false, features = ["libm"] }
kurbo = { version = "0.13.0" }
roxmltree = { version = "0.20.0"}

# Optional native-side rayon / thread-local. Wired up by the
# `multithreading` feature; not pulled in by default. wasm-bindgen-rayon
# was previously declared as an unconditional dep but was never actually
# used in the source — removed to let the workspace build natively for
# `cargo run_wasm` (the runner itself is a host binary).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rayon = { version = "1.11.0", optional = true }
thread_local = { version = "1.1.9", optional = true }

[dev-dependencies]
wasm-bindgen-test = "0.3.50"
console_error_panic_hook = "0.1"
console_log = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { version = "0.2", optional = true }
js-sys = { version = "0.3.91", optional = true }
web-sys = { version = "0.3.91", features = [
    "console",
    "HtmlCanvasElement",
    "Window",
    "Performance",
    "Document",
    "Element",
    "HtmlElement",
    "HtmlCanvasElement",
    "CssStyleDeclaration",
    "WebGl2RenderingContext",
    "MouseEvent",
    "WheelEvent",
    "KeyboardEvent",
    "WebGl2RenderingContext",
    "WebGlContextAttributes",
    "WebGlProgram",
    "WebGlUniformLocation",
    "WebGlBuffer",
    "WebGlShader",
    "WebGlTexture",
    "WebGlFramebuffer",
    "WebGlRenderbuffer",
    "WebGlVertexArrayObject",
    "DomRect",
    "DomRectReadOnly",
], optional = true }


[features]
default = ["std", "png"]
std = ["fearless_simd/std"]
webgl = ["dep:js-sys", "dep:web-sys", "dep:wasm-bindgen"]
png = ["std", "dep:png"]
multithreading = ["std", "dep:rayon", "dep:thread_local"]

# Release tuning. Without these, even `wasm-pack test --release` leaves
# `lto = false` and `codegen-units = 16`, which prevents inlining across
# crate boundaries (kurbo, lyon, fearless_simd) — that's where most of
# the inlinable hot paths actually live, so the result was 3–5× slower
# than a properly tuned standalone build.
#
# - `lto = "fat"`     — full link-time optimization across all crates
# - `codegen-units=1` — single CGU so all functions see each other for inlining
# - `opt-level = 3`   — already the default, but explicit
# - `panic = "abort"` — smaller binary, no unwinding tables in the hot path
# - `overflow-checks = false` — release default, restated for safety
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
overflow-checks = false
debug = false
strip = true

